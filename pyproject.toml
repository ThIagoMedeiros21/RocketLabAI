[project]
name = "cinedata-pydanticai"
version = "0.1.0"
description = "Agente local Text-to-SQL para CineData, na estrutura das aulas RocketLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai]>=2.54,<3", "python-dotenv>=1.0"]

[project.scripts]
cinedata-chat = "cinedata.agente:main"
cinedata-avaliar = "cinedata.avaliacao:main"

[dependency-groups]
dev = ["jupyterlab>=4.2", "ipykernel>=6.29", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cinedata"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
